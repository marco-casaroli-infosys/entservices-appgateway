name: L2-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string

env:
  BUILD_TYPE: Debug
  THUNDER_REF: "R4_4-RDK"
  THUNDER_TOOLS_REF: "R4_4-RDK"
  THUNDER_TOOLS_COMMIT_SHA: "d5dd83c7c19c49c7f25c558c126500bd2d64f7a4"
  THUNDER_COMMIT_SHA: "2c0fcc5529e7da734be558ca6efa05d934dcce31"
  INTERFACES_REF: "20bd0b0825acfe27eb33ffd0e7e38fc0702e82d5"
  NETWORKMANAGER_REF: "cea0da05b03de770e4ce967f0446f28885fc6219"
  AUTOMATICS_UNAME: ${{ secrets.AUTOMATICS_UNAME}}
  AUTOMATICS_PASSCODE: ${{ secrets. AUTOMATICS_PASSCODE}}

jobs:
  L2-tests:
    name: Build and run L2 tests
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [ gcc, clang ]
        coverage: [ with-coverage, without-coverage ]
        exclude:
          - compiler: clang
            coverage: with-coverage
          - compiler: clang
            coverage: without-coverage
          - compiler: gcc
            coverage: without-coverage

    steps:
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
           echo "Message: External Trigger Received for L2 Tests"
           echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9
        with:
          cmake-version: '3.16.x'

      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y libsqlite3-dev libcurl4-openssl-dev valgrind lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev curl protobuf-compiler-grpc libgrpc-dev libgrpc++-dev
         # &&
         # apt-get install -y coreutils mtools dosfstools

      - name: Install GStreamer
        run: |
           sudo apt update
           sudo apt install -y libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Build trevor-base64
        run: |
            if [ ! -d "trower-base64" ]; then
            git clone https://github.com/xmidt-org/trower-base64.git
            fi
            cd trower-base64
            meson setup --warnlevel 3 --werror build
            ninja -C build
            sudo ninja -C build install

      - name: Checkout Thunder
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{env.THUNDER_REF}}
          fetch-depth: 0

      - name: Pin Thunder commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/Thunder"
          git checkout "${{ env.THUNDER_COMMIT_SHA }}"

      - name: Checkout ThunderTools
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{env.THUNDER_TOOLS_REF}}
          fetch-depth: 0

      - name: Pin ThunderTools commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/ThunderTools"
          git checkout "${{ env.THUNDER_TOOLS_COMMIT_SHA }}"

      - name: Checkout entservices-appgateway
        if: ${{ inputs.caller_source == 'local' }}
        uses: actions/checkout@v3
        with:
          path: entservices-appgateway

      - name: Checkout entservices-appgateway-testframework
        if: ${{ inputs.caller_source == 'testframework' }}
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-appgateway
          path: entservices-appgateway
          ref: develop

      - name: Checkout entservices-deviceanddisplay
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-deviceanddisplay
          path: entservices-deviceanddisplay
          ref: develop
         
      - name: Checkout entservices-testframework
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-testframework
          path: entservices-testframework
          ref: 2.0.0

      - name: Checkout googletest
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v3
        with:
          repository: google/googletest
          path: googletest
          ref: v1.15.0

      - name: Apply patches ThunderTools
        run: |  
          cd $GITHUB_WORKSPACE/ThunderTools
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/00010-R4.4-Add-support-for-project-dir.patch
          cd -

      - name: Build ThunderTools
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Apply patches Thunder
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Use_Legact_Alt_Based_On_ThunderTools_R4.4.3.patch
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/error_code_R4_4.patch
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/1004-Add-support-for-project-dir.patch
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-733-Add-ENTOS-IDS.patch
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Jsonrpc_dynamic_error_handling.patch
          #patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/Increase_Timout_For_L2Tests_Plugin.patch
          cd -
      - name: Build Thunder
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=${{env.BUILD_TYPE}}
          -DBINDING=127.0.0.1
          -DPORT=9998
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Checkout entservices-apis
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}
          run: rm -rf $GITHUB_WORKSPACE/entservices-apis/jsonrpc/DTV.json

      - name: Apply patches entservices-apis
        run: |
          cd $GITHUB_WORKSPACE/entservices-apis
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/RDKEMW-1007.patch
          patch -p1 < $GITHUB_WORKSPACE/entservices-testframework/patches/add-l2tests-interface.patch
          cd -    

      - name: Build entservices-apis
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      - name: Generate external headers
        # Empty headers to mute errors
        run: >
          cd "$GITHUB_WORKSPACE/entservices-testframework/Tests/"
          &&
          mkdir -p
          headers
          headers/rdk/ds
          headers/rdk/iarmbus
          headers/rdk/iarmmgrs-hal
          headers/systemservices
          headers/systemservices/proc
          headers/libusb
          headers/Dobby
          headers/Dobby/Public/Dobby
          headers/Dobby/IpcService
          &&
          cd headers
          &&
          touch
          rdk/ds/host.hpp
          rdk/ds/videoOutputPort.hpp
          rdk/ds/videoOutputPortType.hpp
          rdk/ds/videoOutputPortConfig.hpp
          rdk/ds/videoResolution.hpp
          rdk/ds/audioOutputPort.hpp
          rdk/ds/audioOutputPortType.hpp
          rdk/ds/sleepMode.hpp
          rdk/ds/frontPanelConfig.hpp
          rdk/ds/frontPanelTextDisplay.hpp
          rdk/ds/hdmiIn.hpp
          rdk/ds/compositeIn.hpp
          rdk/ds/audioOutputPortConfig.hpp
          rdk/ds/exception.hpp
          rdk/ds/dsError.h
          rdk/ds/dsMgr.h
          rdk/ds/manager.hpp
          rdk/ds/dsTypes.h
          rdk/ds/dsUtl.h
          rdk/ds/audioOutputPortType.hpp
          rdk/ds/audioOutputPortConfig.hpp
          rdk/ds/pixelResolution.hpp
          rdk/iarmbus/libIARM.h
          rdk/iarmbus/libIBus.h
          rdk/iarmbus/libIBusDaemon.h
          rdk/iarmmgrs-hal/mfrMgr.h
          rdk/iarmmgrs-hal/pwrMgr.h
          rdk/iarmmgrs-hal/sysMgr.h
          rdk/iarmbus/iarmUtil.h
          rfcapi.h
          rbus.h
          libudev.h
          libusb/libusb.h
          systemservices/proc/readproc.h
          systemservices/secure_wrapper.h
          systemaudioplatform.h
          maintenanceMGR.h
          pkg.h
          edid-parser.hpp
          btmgr.h
          tvError.h
          tvTypes.h
          tvTypesODM.h
          tvSettings.h
          tvSettingsExtODM.h
          tvSettingsODM.h
          tvTypesODM.h
          tr181api.h
          list.hpp
          dsDisplay.h
          rdk/ds/AudioStereoMode.hpp
          rdk/ds/VideoDFC.hpp
          dsRpc.h
          Dobby/DobbyProtocol.h
          Dobby/DobbyProxy.h
          Dobby/Public/Dobby/IDobbyProxy.h
          Dobby/IpcService/IpcFactory.h
          &&
          cp -r /usr/include/gstreamer-1.0/gst /usr/include/glib-2.0/* /usr/lib/x86_64-linux-gnu/glib-2.0/include/* /usr/local/include/trower-base64/base64.h /usr/include/libdrm/drm.h /usr/include/libdrm/drm_mode.h /usr/include/xf86drm.h .

      - name: Set clang toolchain
        if: ${{ matrix.compiler == 'clang' }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/clang.cmake" >> $GITHUB_ENV

      - name: Set gcc/with-coverage toolchain
        if: ${{ matrix.compiler == 'gcc' && matrix.coverage == 'with-coverage' && !env.ACT }}
        run: echo "TOOLCHAIN_FILE=$GITHUB_WORKSPACE/entservices-testframework/Tests/gcc-with-coverage.cmake" >> $GITHUB_ENV

      - name: Build googletest
        if: steps.cache.outputs.cache-hit != 'true'
        run: >
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/googletest"
          -B build/googletest
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DBUILD_TYPE=Debug
          -DBUILD_GMOCK=ON
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          &&
          cmake --build build/googletest -j8
          &&
          cmake --install build/googletest

      - name: Build mocks
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-testframework/Tests/mocks"
          -B build/mocks
          -DBUILD_SHARED_LIBS=ON
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DCMAKE_CXX_FLAGS="
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/install/usr/include"
          &&
          cmake --build build/mocks -j8
          &&
          cmake --install build/mocks

      - name: Build entservices-deviceanddisplay
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-deviceanddisplay"
          -B build/entservices-deviceanddisplay
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DDEVICE_TYPE=AVOutputTV
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices/proc
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I $GITHUB_WORKSPACE/install/usr/include
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Wraps.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/readprocMockInterface.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/btmgr.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvError.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsExtODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvTypes.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/essos-resmgr.h
          -Wall -Wno-unused-result -Wno-deprecated-declarations -Wno-error=format=
          -Wl,-wrap,system -Wl,-wrap,popen -Wl,-wrap,syslog -Wl,-wrap,v_secure_system -Wl,-wrap,v_secure_popen -Wl,-wrap,v_secure_pclose -Wl,-wrap,unlink
          -DUSE_IARMBUS
          -DENABLE_ERM
          -DRDK_LOG_MILESTONE
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN
          -DHAS_API_POWERSTATE
          -DENABLE_THERMAL_PROTECTION"
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DPLUGIN_SYSTEMSERVICES=ON
          -DPLUGIN_POWERMANAGER=ON
          -DPLUGIN_DISPLAYSETTINGS=OFF
          -DPLUGIN_USERPREFERENCES=OFF
          -DPLUGIN_DEVICEDIAGNOSTICS=OFF
          -DPLUGIN_WAREHOUSE=OFF
          -DUSE_THUNDER_R4=ON
          -DPLUGIN_L2Tests=ON
          -DRDK_SERVICE_L2_TEST=ON
          -DDS_FOUND=ON
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          &&
          cmake --build build/entservices-deviceanddisplay -j8
          &&
          cmake --install build/entservices-deviceanddisplay

      - name: Checkout networkmanager
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/networkmanager
          path: networkmanager
          ref: ${{env.NETWORKMANAGER_REF}}

      - name: Stage INetworkManager.h into install prefix
        run: |
          set -euo pipefail
          dst_dir="$GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces"
          mkdir -p "$dst_dir"
          cp -f "$GITHUB_WORKSPACE/networkmanager/interface/INetworkManager.h" "$dst_dir/INetworkManager.h"

      - name: Build entservices-appgateway
        run: >
          cmake
          -S "$GITHUB_WORKSPACE/entservices-appgateway"
          -B build/entservices-appgateway
          -DCMAKE_TOOLCHAIN_FILE="${{ env.TOOLCHAIN_FILE }}"
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          -DHIDE_NON_EXTERNAL_SYMBOLS=OFF
          -DPLUGIN_CLOUDSTORE_URI="localhost:50051"
          -DCMAKE_CXX_FLAGS="
          -DEXCEPTIONS_ENABLE=ON
          -fprofile-arcs
          -ftest-coverage
          -DTHUNDER_VERSION=4
          -DTHUNDER_VERSION_MAJOR=4
          -DTHUNDER_VERSION_MINOR=4
          -DDEVICE_TYPE=AVOutputTV
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/ds
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmbus
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/rdk/iarmmgrs-hal
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/systemservices/proc
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/libusb
          -I $GITHUB_WORKSPACE/install/usr/include
          -I $GITHUB_WORKSPACE/build/mocks
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/Public/Dobby
          -I $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/IpcService
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/devicesettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Iarm.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Rfc.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/RBus.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Udev.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Wraps.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/libusb/libusb.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/maintenanceMGR.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/pkg.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/secure_wrappermock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/wpa_ctrl_mock.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/readprocMockInterface.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/btmgr.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tr181api.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettings.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvError.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsExtODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvSettingsODM.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/tvTypes.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/essos-resmgr.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/Dobby.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/i_omi_proxy.hpp
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/mocks/omi_proxy.hpp
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/DobbyProtocol.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/DobbyProxy.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/Public/Dobby/IDobbyProxy.h
          -include $GITHUB_WORKSPACE/entservices-testframework/Tests/headers/Dobby/IpcService/IpcFactory.h
          -Werror -Wall -Wno-unused-result -Wno-unused-variable -Wno-deprecated-declarations -Wno-error=format= -Wno-error=format-truncation
          -DUSE_IARMBUS
          -DHAS_RBUS
          -DRDK_SERVICE_L2_TEST
          -DDISABLE_SECURITY_TOKEN
          -DENABLE_THERMAL_PROTECTION"
          -DPLUGIN_PERSISTENTSTORE_PATH="/tmp/secure/persistent/rdkservicestore"
          -DPLUGIN_PERSISTENTSTORE_LEGACYPATH="/tmp/persistent/rdkservicestore"
          -DPLUGIN_STORAGE_MANAGER_PATH="/tmp/persistent/storageManager"
          -DCOMCAST_CONFIG=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_DS=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_IARMBus=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Udev=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RFC=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_RBus=ON
          -DPLUGIN_MIGRATION=ON
          -DPLUGIN_TELEMETRY=ON
          -DPLUGIN_USERSETTINGS=ON
          -DPLUGIN_PERSISTENTSTORE=ON
          -DPLUGIN_SHAREDSTORAGE=ON
          -DPLUGIN_RESOURCEMANAGER=ON
          -DPLUGIN_CLOUDSTORE=ON
          -DPLUGIN_USBDEVICE=ON
