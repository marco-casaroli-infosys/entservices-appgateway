name: L0-tests

on:
  workflow_call:
    inputs:
      caller_source:
        description: "Specifies the source type (e.g., local or test framework) for the workflow."
        required: true
        type: string
      enable_gdb:
        description: "Opt-in: run the L0 test binary under gdb in batch mode (prints stack trace on crash)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  BUILD_TYPE: Debug
  THUNDER_REF: "R4_4-RDK"
  THUNDER_TOOLS_REF: "R4_4-RDK"
  THUNDER_TOOLS_COMMIT_SHA: "d5dd83c7c19c49c7f25c558c126500bd2d64f7a4"
  THUNDER_COMMIT_SHA: "2c0fcc5529e7da734be558ca6efa05d934dcce31"
  INTERFACES_REF: "topic/RDKEMW-20993"
  ENABLE_GDB: ${{ (inputs.enable_gdb && '1') || '0' }}
  # L0 test targets to build and run -- To add a new plugin, append its test binary name here and add its target in Tests/L0Tests/CMakeLists.txt.
  L0_PLUGIN_TESTS: "appgateway_l0test appgatewaycommon_l0test appnotifications_l0test appactions_l0test"

jobs:
  L0-tests:
    name: Build and run L0 tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout entservices-appgateway
        if: ${{ !env.ACT }}
        uses: actions/checkout@v3

      - name: Set up cache
        if: ${{ !env.ACT }}
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            build/Thunder
            build/entservices-apis
            build/ThunderTools
            install/usr
            install/tools/cmake
            install/usr/tools/cmake
            !install/usr/etc/WPEFramework/plugins
            !install/usr/lib/wpeframework/plugins
          key: ${{ runner.os }}-${{ env.THUNDER_REF }}-${{ env.INTERFACES_REF }}-l0-4

      - name: Validate cached toolchain artifacts
        id: toolchain
        run: |
          set -euo pipefail

          prefix_usr="$GITHUB_WORKSPACE/install/usr"
          prefix_tools_primary="$GITHUB_WORKSPACE/install/tools/cmake"
          prefix_tools_alt="$GITHUB_WORKSPACE/install/usr/tools/cmake"
          prefix_tools=""
          need_rebuild=0

          framework_cfg="$(find "$prefix_usr" -type f -name 'WPEFrameworkConfig.cmake' -print -quit 2>/dev/null || true)"
          plugins_cfg="$(find "$prefix_usr" -type f -name 'WPEFrameworkPluginsConfig.cmake' -print -quit 2>/dev/null || true)"
          helper_mod="$(find "$GITHUB_WORKSPACE/install" -type f -name 'CmakeHelperFunctions.cmake' -print -quit 2>/dev/null || true)"

          if [ -d "$prefix_tools_primary" ]; then
            prefix_tools="$prefix_tools_primary"
          elif [ -d "$prefix_tools_alt" ]; then
            prefix_tools="$prefix_tools_alt"
          fi

          if [ -z "${framework_cfg}" ] || [ -z "${plugins_cfg}" ] || [ -z "${helper_mod}" ] || [ -z "$prefix_tools" ]; then
            need_rebuild=1
          fi

          echo "framework_cfg=${framework_cfg:-<missing>}"
          echo "plugins_cfg=${plugins_cfg:-<missing>}"
          echo "helper_mod=${helper_mod:-<missing>}"
          echo "prefix_tools=$prefix_tools"
          echo "need_rebuild=$need_rebuild"

          echo "need_rebuild=${need_rebuild}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - run: pip install jsonref

      - name: ACK External Trigger
        run: |
          echo "Message: External Trigger Received for L0 Tests"
          echo "Trigger Source: ${{ inputs.caller_source }}"

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@65b272e1213f99771fbba0c237e0b3312270e0c9
        with:
          cmake-version: '3.16.x'

      - name: Install packages
        run: >
          sudo apt update
          &&
          sudo apt install -y libsqlite3-dev libcurl4-openssl-dev valgrind lcov clang libsystemd-dev libboost-all-dev libwebsocketpp-dev meson libcunit1 libcunit1-dev curl protobuf-compiler-grpc libgrpc-dev libgrpc++-dev libjsoncpp-dev gdb ninja-build uuid-dev

      - name: Install lcov 2.4
        run: |
          set -euo pipefail
          sudo apt-get install -y libcapture-tiny-perl libdatetime-perl libtimedate-perl
          cd /tmp
          curl -sL https://github.com/linux-test-project/lcov/releases/download/v2.4/lcov-2.4.tar.gz -o lcov-2.4.tar.gz
          tar xzf lcov-2.4.tar.gz
          sudo make -C lcov-2.4 install PREFIX=/usr
          lcov --version

      - name: Build trower-base64
        run: |
          if [ ! -d "trower-base64" ]; then
            git clone https://github.com/xmidt-org/trower-base64.git
          fi
          cd trower-base64
          meson setup --warnlevel 3 --werror build
          ninja -C build
          sudo ninja -C build install

      - name: Checkout Thunder
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/Thunder
          path: Thunder
          ref: ${{env.THUNDER_REF}}
          fetch-depth: 0

      - name: Checkout ThunderTools
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/ThunderTools
          path: ThunderTools
          ref: ${{env.THUNDER_TOOLS_REF}}
          fetch-depth: 0

      - name: Pin ThunderTools commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/ThunderTools"
          git checkout "${{ env.THUNDER_TOOLS_COMMIT_SHA }}"

      - name: Checkout entservices-apis
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        uses: actions/checkout@v3
        with:
          repository: rdkcentral/entservices-apis
          path: entservices-apis
          ref: ${{env.INTERFACES_REF}}

      - name: Apply patches ThunderTools
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: |
          cd $GITHUB_WORKSPACE/ThunderTools
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/00010-R4.4-Add-support-for-project-dir.patch
          cd -

      - name: Build ThunderTools
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: >
          set -euo pipefail
          &&
          TOOLCHAIN_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake;$GITHUB_WORKSPACE/install/usr/tools/cmake"
          &&
          TOOLCHAIN_GENERIC_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/ThunderTools"
          -B build/ThunderTools
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr;$GITHUB_WORKSPACE/install"
          -DCMAKE_MODULE_PATH="$TOOLCHAIN_MODULE_PATH"
          -DGENERIC_CMAKE_MODULE_PATH="$TOOLCHAIN_GENERIC_MODULE_PATH"
          &&
          cmake --build build/ThunderTools -j8
          &&
          cmake --install build/ThunderTools

      - name: Normalize toolchain cmake module path
        run: |
          set -euo pipefail
          primary="$GITHUB_WORKSPACE/install/tools/cmake"
          alt="$GITHUB_WORKSPACE/install/usr/tools/cmake"
          mkdir -p "$primary"
          if [ -d "$alt" ]; then
            cp -af "$alt/." "$primary/" 2>/dev/null || true
          fi

          if [ ! -f "$primary/CmakeHelperFunctions.cmake" ]; then
            helper_src="$(find \
              "$GITHUB_WORKSPACE/install" \
              "$GITHUB_WORKSPACE/build" \
              "$GITHUB_WORKSPACE/Thunder" \
              "$GITHUB_WORKSPACE/ThunderTools" \
              -type f -name 'CmakeHelperFunctions.cmake' -print -quit 2>/dev/null || true)"

            if [ -n "${helper_src}" ] && [ -f "${helper_src}" ]; then
              cp -f "${helper_src}" "$primary/CmakeHelperFunctions.cmake"
              echo "Recovered CmakeHelperFunctions.cmake from: ${helper_src}"
            fi
          fi

          if [ ! -f "$primary/CmakeHelperFunctions.cmake" ]; then
            echo "Missing CmakeHelperFunctions.cmake in $primary"
            echo "Searched roots: $GITHUB_WORKSPACE/install, $GITHUB_WORKSPACE/build, $GITHUB_WORKSPACE/Thunder, $GITHUB_WORKSPACE/ThunderTools"
            find "$GITHUB_WORKSPACE/install" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/Thunder" "$GITHUB_WORKSPACE/ThunderTools" -type f -name 'CmakeHelperFunctions.cmake' 2>/dev/null || true

            echo "Creating fallback helper module for L0 build"
            cat > "$primary/CmakeHelperFunctions.cmake" <<'EOF'
          # Auto-generated fallback used only when helper module is unavailable.
          # This keeps configure progressing in CI for L0-only verification builds.
          function(write_config PLUGIN_NAME)
          endfunction()
          function(InstallPackageConfig)
          endfunction()
          EOF
          fi

      - name: Apply patches Thunder
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: |
          cd $GITHUB_WORKSPACE/Thunder
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/Use_Legact_Alt_Based_On_ThunderTools_R4.4.3.patch
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/error_code_R4_4.patch
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/1004-Add-support-for-project-dir.patch
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/RDKEMW-733-Add-ENTOS-IDS.patch
          #patch -p1 < $GITHUB_WORKSPACE/Tests/patches/Jsonrpc_dynamic_error_handling.patch
          cd -
    
      - name: Pin Thunder commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          cd "$GITHUB_WORKSPACE/Thunder"
          git checkout "${{ env.THUNDER_COMMIT_SHA }}"

      - name: Build Thunder
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: >
          set -euo pipefail
          &&
          TOOLCHAIN_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake;$GITHUB_WORKSPACE/install/usr/tools/cmake"
          &&
          TOOLCHAIN_GENERIC_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
          &&
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/Thunder"
          -B build/Thunder
          -DMESSAGING=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr;$GITHUB_WORKSPACE/install"
          -DCMAKE_MODULE_PATH="$TOOLCHAIN_MODULE_PATH"
          -DGENERIC_CMAKE_MODULE_PATH="$TOOLCHAIN_GENERIC_MODULE_PATH"
          -DBUILD_TYPE=Debug
          -DBINDING=127.0.0.1
          -DPORT=55555
          -DEXCEPTIONS_ENABLE=ON
          &&
          cmake --build build/Thunder -j8
          &&
          cmake --install build/Thunder

      - name: Apply patches entservices-apis
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: |
          cd $GITHUB_WORKSPACE/entservices-apis
          patch -p1 < $GITHUB_WORKSPACE/Tests/patches/RDKEMW-1007.patch
          cd -

      - name: Build entservices-apis
        if: steps.cache.outputs.cache-hit != 'true' || steps.toolchain.outputs.need_rebuild == '1'
        run: >
          set -euo pipefail
          &&
          TOOLCHAIN_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake;$GITHUB_WORKSPACE/install/usr/tools/cmake"
          &&
          cmake -G Ninja
          -S "$GITHUB_WORKSPACE/entservices-apis"
          -B build/entservices-apis
          -DEXCEPTIONS_ENABLE=ON
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install/usr"
          -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr;$GITHUB_WORKSPACE/install"
          -DCMAKE_MODULE_PATH="$TOOLCHAIN_MODULE_PATH"
          &&
          cmake --build build/entservices-apis -j8
          &&
          cmake --install build/entservices-apis

      - name: Ensure ConfigGenerator executable exists in local prefix (act/CI)
        run: |
          set -euo pipefail

          prefix="$GITHUB_WORKSPACE/install/usr"
          mkdir -p "$prefix/bin"

          if [ -x "$prefix/bin/ConfigGenerator" ]; then
            echo "ConfigGenerator already present at: $prefix/bin/ConfigGenerator"
            exit 0
          fi

          # Prefer an already-installed executable anywhere under the local prefix.
          existing_exec="$(find "$prefix" -maxdepth 6 -type f -name 'ConfigGenerator' -perm -u+x -print -quit 2>/dev/null || true)"
          if [ -n "${existing_exec}" ]; then
            ln -sf "${existing_exec}" "$prefix/bin/ConfigGenerator"
            echo "Linked existing ConfigGenerator executable: ${existing_exec} -> $prefix/bin/ConfigGenerator"
            exit 0
          fi

          # Fallback: locate python implementation under install/build/workspace trees.
          impl="$(find "$prefix" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/ThunderTools" \
                    -type f -name 'config_generator.py' -print -quit 2>/dev/null || true)"
          if [ -z "${impl}" ] || [ ! -f "${impl}" ]; then
            echo "WARN: Could not locate config_generator.py under prefix/build/workspace"
            echo "Searched roots: $prefix, $GITHUB_WORKSPACE/build, $GITHUB_WORKSPACE/ThunderTools"
            find "$prefix" "$GITHUB_WORKSPACE/build" "$GITHUB_WORKSPACE/ThunderTools" \
              -maxdepth 8 -type f \( -name 'config_generator.py' -o -name 'ConfigGenerator' \) 2>/dev/null || true

            echo "Creating fallback no-op ConfigGenerator shim at $prefix/bin/ConfigGenerator"
            cat > "$prefix/bin/ConfigGenerator" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "WARN: Using fallback no-op ConfigGenerator shim (real implementation not found)." >&2
          exit 0
          EOF
            chmod +x "$prefix/bin/ConfigGenerator"
            exit 0
          fi

          echo "Using ConfigGenerator python implementation: ${impl}"

          cat > "$prefix/bin/ConfigGenerator" <<EOF
          #!/usr/bin/env bash
          set -euo pipefail
          exec python3 "${impl}" "\$@"
          EOF

          chmod +x "$prefix/bin/ConfigGenerator"

      - name: Ensure ConfigGenerator CMake package config exists in local prefix (act/CI)
        run: |
          set -euo pipefail

          prefix="$GITHUB_WORKSPACE/install/usr"
          pkgdir="$prefix/lib/cmake/ConfigGenerator"
          cfg="$pkgdir/ConfigGeneratorConfig.cmake"
          ver="$pkgdir/ConfigGeneratorConfigVersion.cmake"

          mkdir -p "$pkgdir"

          findmod="$(find "$prefix" -type f -name 'FindConfigGenerator.cmake' -print -quit 2>/dev/null || true)"
          findmod_dir=""
          if [ -n "${findmod}" ]; then
            findmod_dir="$(dirname "${findmod}")"
            echo "Found FindConfigGenerator.cmake at: ${findmod}"
          else
            echo "INFO: FindConfigGenerator.cmake not found under prefix: ${prefix} (continuing with tool-only fallback config)"
          fi

          echo "Generating ConfigGeneratorConfig.cmake at: $cfg"
          if [ -n "${findmod_dir}" ]; then
            cat > "$cfg" <<EOF
          include(CMakeFindDependencyMacro)

          set(_cg_module_dir "${findmod_dir}")
          get_filename_component(_cg_module_dir "\${_cg_module_dir}" ABSOLUTE)

          if(EXISTS "\${_cg_module_dir}/FindConfigGenerator.cmake")
            list(PREPEND CMAKE_MODULE_PATH "\${_cg_module_dir}")
          endif()

          find_package(ConfigGenerator REQUIRED MODULE)
          EOF
          else
            cat > "$cfg" <<'EOF'
          set(_cg_prefix "${CMAKE_CURRENT_LIST_DIR}/../../..")
          get_filename_component(_cg_prefix "${_cg_prefix}" ABSOLUTE)

          find_program(CONFIGGENERATOR_EXECUTABLE
            NAMES ConfigGenerator
            HINTS "${_cg_prefix}/bin" "${_cg_prefix}/sbin" "${_cg_prefix}/usr/bin" "${_cg_prefix}/usr/sbin"
          )

          if(NOT CONFIGGENERATOR_EXECUTABLE)
            message(FATAL_ERROR "ConfigGenerator executable not found under prefix: ${_cg_prefix}")
          endif()

          if(NOT TARGET ConfigGenerator::ConfigGenerator)
            add_executable(ConfigGenerator::ConfigGenerator IMPORTED GLOBAL)
            set_target_properties(ConfigGenerator::ConfigGenerator PROPERTIES
              IMPORTED_LOCATION "${CONFIGGENERATOR_EXECUTABLE}"
            )
          endif()

          if(NOT TARGET ConfigGenerator::configgenerator)
            add_executable(ConfigGenerator::configgenerator ALIAS ConfigGenerator::ConfigGenerator)
          endif()

          set(ConfigGenerator_FOUND TRUE)
          EOF
          fi

          if [ ! -f "$ver" ]; then
            cat > "$ver" <<'EOF'
          set(PACKAGE_VERSION "0.0.0")
          set(PACKAGE_VERSION_COMPATIBLE TRUE)
          set(PACKAGE_VERSION_EXACT FALSE)
          EOF
          fi

      - name: "Sanity check: ConfigGenerator package is installed"
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/install/usr/lib/cmake/ConfigGenerator/ConfigGeneratorConfig.cmake"
          echo "Found: $GITHUB_WORKSPACE/install/usr/lib/cmake/ConfigGenerator/ConfigGeneratorConfig.cmake"

      - name: Stage INetworkManager.h into install prefix (required for AppGateway compile)
        run: |
          set -euo pipefail
          dst_dir="$GITHUB_WORKSPACE/install/usr/include/WPEFramework/interfaces"
          mkdir -p "$dst_dir"
          url="https://raw.githubusercontent.com/rdkcentral/networkmanager/develop/interface/INetworkManager.h"
          curl -fsSL "$url" -o "$dst_dir/INetworkManager.h"

      - name: Detect framework namespace and package dirs
        id: nsdetect
        run: |
          set -euo pipefail

          prefix_usr="$GITHUB_WORKSPACE/install/usr"

          wpe_core_cfg="$(find "$prefix_usr" -type f -name 'WPEFrameworkConfig.cmake' -print -quit 2>/dev/null || true)"
          wpe_plugins_cfg="$(find "$prefix_usr" -type f -name 'WPEFrameworkPluginsConfig.cmake' -print -quit 2>/dev/null || true)"
          th_core_cfg="$(find "$prefix_usr" -type f -name 'ThunderConfig.cmake' -print -quit 2>/dev/null || true)"
          th_plugins_cfg="$(find "$prefix_usr" -type f -name 'ThunderPluginsConfig.cmake' -print -quit 2>/dev/null || true)"

          echo "WPE core cfg: ${wpe_core_cfg:-<missing>}"
          echo "WPE plugins cfg: ${wpe_plugins_cfg:-<missing>}"
          echo "Thunder core cfg: ${th_core_cfg:-<missing>}"
          echo "Thunder plugins cfg: ${th_plugins_cfg:-<missing>}"

          namespace=""
          if [ -n "${th_core_cfg}" ] && [ -n "${th_plugins_cfg}" ]; then
            namespace="Thunder"
          elif [ -n "${wpe_core_cfg}" ] && [ -n "${wpe_plugins_cfg}" ]; then
            namespace="WPEFramework"
          fi

          if [ -z "${namespace}" ]; then
            echo "Unable to detect a complete framework package set under: $prefix_usr"
            echo "WPE core: ${wpe_core_cfg:-<missing>}"
            echo "WPE plugins: ${wpe_plugins_cfg:-<missing>}"
            echo "Thunder core: ${th_core_cfg:-<missing>}"
            echo "Thunder plugins: ${th_plugins_cfg:-<missing>}"
            find "$prefix_usr" -maxdepth 6 -type f -name '*Config.cmake' | sort || true
            exit 1
          fi

          wpe_core_dir=""
          wpe_plugins_dir=""
          th_core_dir=""
          th_plugins_dir=""

          if [ -n "${wpe_core_cfg}" ]; then wpe_core_dir="$(dirname "$wpe_core_cfg")"; fi
          if [ -n "${wpe_plugins_cfg}" ]; then wpe_plugins_dir="$(dirname "$wpe_plugins_cfg")"; fi
          if [ -n "${th_core_cfg}" ]; then th_core_dir="$(dirname "$th_core_cfg")"; fi
          if [ -n "${th_plugins_cfg}" ]; then th_plugins_dir="$(dirname "$th_plugins_cfg")"; fi

          echo "Detected namespace=${namespace}"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"
          echo "wpe_core_dir=${wpe_core_dir}" >> "$GITHUB_OUTPUT"
          echo "wpe_plugins_dir=${wpe_plugins_dir}" >> "$GITHUB_OUTPUT"
          echo "th_core_dir=${th_core_dir}" >> "$GITHUB_OUTPUT"
          echo "th_plugins_dir=${th_plugins_dir}" >> "$GITHUB_OUTPUT"

      - name: Build plugins and stage to install prefix
        run: |
          set -euo pipefail

          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr;$GITHUB_WORKSPACE/install${CMAKE_PREFIX_PATH:+;${CMAKE_PREFIX_PATH}}"
          export CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake${CMAKE_MODULE_PATH:+;${CMAKE_MODULE_PATH}}"
          export PATH="$GITHUB_WORKSPACE/install/usr/bin:$PATH"
          APPGW_NAMESPACE="${{ steps.nsdetect.outputs.namespace }}"
          echo "Using APPGW_NAMESPACE=${APPGW_NAMESPACE}"

          CMAKE_ARGS=(
            -G Ninja
            -S "$GITHUB_WORKSPACE"
            -B build/entservices-appgateway-l0
            -DCMAKE_BUILD_TYPE=Debug
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH"
            -DCMAKE_MODULE_PATH="$CMAKE_MODULE_PATH"
            -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake"
            -DConfigGenerator_DIR="$GITHUB_WORKSPACE/install/usr/lib/cmake/ConfigGenerator"
            -DDISABLE_SECURITY_TOKEN=ON
            -DUSE_THUNDER_R4=ON
            -DNAMESPACE="$APPGW_NAMESPACE"
            -DPLUGIN_APPGATEWAY=ON
            -DPLUGIN_APPGATEWAYCOMMON=ON
            -DPLUGIN_APPACTIONS=ON
            -DCMAKE_VERBOSE_MAKEFILE=ON
          )

          if [ "WPEFramework" = "$APPGW_NAMESPACE" ]; then
            if [ -n "${{ steps.nsdetect.outputs.wpe_core_dir }}" ]; then
              CMAKE_ARGS+=("-DWPEFramework_DIR=${{ steps.nsdetect.outputs.wpe_core_dir }}")
            fi
            if [ -n "${{ steps.nsdetect.outputs.wpe_plugins_dir }}" ]; then
              CMAKE_ARGS+=("-DWPEFrameworkPlugins_DIR=${{ steps.nsdetect.outputs.wpe_plugins_dir }}")
            fi
          else
            if [ -n "${{ steps.nsdetect.outputs.th_core_dir }}" ]; then
              CMAKE_ARGS+=("-DThunder_DIR=${{ steps.nsdetect.outputs.th_core_dir }}")
            fi
            if [ -n "${{ steps.nsdetect.outputs.th_plugins_dir }}" ]; then
              CMAKE_ARGS+=("-DThunderPlugins_DIR=${{ steps.nsdetect.outputs.th_plugins_dir }}")
            fi
          fi

          cmake "${CMAKE_ARGS[@]}"

          cmake --build build/entservices-appgateway-l0 -- -j"$(nproc)"

          plugin_dir_wpe="$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins"
          plugin_dir_ns="$GITHUB_WORKSPACE/install/usr/lib/thunder/plugins"

          mkdir -p "$plugin_dir_wpe"
          find build/entservices-appgateway-l0 -type f \( -name "lib*AppGateway*.so*" -o -name "libWPEFramework*AppGateway*.so*" -o -name "libThunder*AppGateway*.so*" \) -exec cp -f {} "$plugin_dir_wpe/" \; 2>/dev/null || true

          mkdir -p "$plugin_dir_ns"
          cp -af "$plugin_dir_wpe/." "$plugin_dir_ns/" 2>/dev/null || true

          test -e "$plugin_dir_wpe/libAppGateway.so" || \
          test -e "$plugin_dir_wpe/libWPEFrameworkAppGateway.so" || \
          test -e "$plugin_dir_wpe/libThunderAppGateway.so" || \
          test -e "$plugin_dir_ns/libAppGateway.so" || \
          test -e "$plugin_dir_ns/libWPEFrameworkAppGateway.so" || \
          test -e "$plugin_dir_ns/libThunderAppGateway.so" || \
          (echo "Missing AppGateway plugin library in staged plugin dirs" && find build/entservices-appgateway-l0 -type f -name "lib*AppGateway*.so*" 2>/dev/null || true && exit 1)

          echo "Staged plugin libraries:"
          ls -la "$plugin_dir_wpe/" || true

      - name: Build L0 tests (Tests/L0Tests)
        run: |
          set -euo pipefail

          export CMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install/usr;$GITHUB_WORKSPACE/install${CMAKE_PREFIX_PATH:+;${CMAKE_PREFIX_PATH}}"
          export CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake;$GITHUB_WORKSPACE/install/usr/tools/cmake${CMAKE_MODULE_PATH:+;${CMAKE_MODULE_PATH}}"
          export PREFIX="$GITHUB_WORKSPACE/install/usr"

          APPGW_NAMESPACE="${{ steps.nsdetect.outputs.namespace }}"
          echo "Using APPGW_NAMESPACE=${APPGW_NAMESPACE} for L0 tests"

          cmake -G Ninja \
            -S "$GITHUB_WORKSPACE/Tests/L0Tests" \
            -B build/entservices-appgateway-l0tests-only \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_MODULE_PATH="$CMAKE_MODULE_PATH" \
            -DGENERIC_CMAKE_MODULE_PATH="$GITHUB_WORKSPACE/install/tools/cmake" \
            -DPREFIX="$PREFIX" \
            -DNAMESPACE="$APPGW_NAMESPACE" \
            -DAPPGW_ENABLE_COVERAGE=ON

          # Build all L0 test targets defined in L0_PLUGIN_TESTS
          for target in ${{ env.L0_PLUGIN_TESTS }}; do
            echo "Building target: $target"
            cmake --build build/entservices-appgateway-l0tests-only --target "$target" -- -j"$(nproc)"
          done

      - name: Stage AppGateway resolution config for tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/app-gateway
          cp -f "$GITHUB_WORKSPACE/AppGateway/resolutions/resolution.base.json" /tmp/app-gateway/resolution.base.json
          if [ -w /etc ] || [ "$(id -u)" = "0" ]; then
            mkdir -p /etc/app-gateway
            cp -f "$GITHUB_WORKSPACE/AppGateway/resolutions/resolution.base.json" /etc/app-gateway/resolution.base.json
          elif command -v sudo >/dev/null 2>&1; then
            sudo mkdir -p /etc/app-gateway
            sudo cp -f "$GITHUB_WORKSPACE/AppGateway/resolutions/resolution.base.json" /etc/app-gateway/resolution.base.json
          fi
          echo "APPGATEWAY_CONFIG_PATH=/etc/app-gateway" >> "$GITHUB_ENV"
          echo "APPGATEWAY_RESOLUTIONS_PATH=/etc/app-gateway/resolution.base.json" >> "$GITHUB_ENV"

      - name: Run L0 tests
        id: run_l0_tests
        continue-on-error: true
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH:-}"

          build_dir="build/entservices-appgateway-l0tests-only"
          overall_rc=0

          # Run each L0 test target, collecting individual logs
          for target in ${{ env.L0_PLUGIN_TESTS }}; do
            test_bin="${build_dir}/${target}"
            if [ ! -x "$test_bin" ]; then
              echo "WARNING: $test_bin not found or not executable — skipping"
              continue
            fi

            echo "======================================"
            echo "Running: $target"
            echo "======================================"
            set +e
            "$test_bin" 2>&1 | tee "l0-test-${target}.log"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then overall_rc=1; fi
          done

          # Merge individual logs into a combined log
          cat l0-test-*.log > l0-test.log 2>/dev/null || true

          echo "==== Failed test cases (run step) ===="
          grep -E '^\[ +FAILED +\]' l0-test.log || true
          grep -E '^FAIL:' l0-test.log || true
          echo "==== Total failures (run step) ===="
          grep -E 'l0test total failures:? [0-9]+' l0-test.log || true

          exit "$overall_rc"

      - name: Summarize failed tests
        if: ${{ always() }}
        run: |
          set -euo pipefail
          if [ -f l0-test.log ]; then
            echo "==== Failed test cases (if any) ===="
            grep -E '^\[ +FAILED +\]' l0-test.log || echo "No explicit [ FAILED ] lines found"
            echo "==== Total failures ===="
            grep -E 'l0test total failures:? [0-9]+' l0-test.log || true
          else
            echo "l0-test.log not found"
          fi

      - name: Run L0 tests under valgrind
        if: ${{ !env.ACT }}
        continue-on-error: true
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH:-}"

          build_dir="build/entservices-appgateway-l0tests-only"

          for target in ${{ env.L0_PLUGIN_TESTS }}; do
            test_bin="${build_dir}/${target}"
            if [ ! -x "$test_bin" ]; then
              echo "WARNING: $test_bin not found or not executable — skipping valgrind"
              continue
            fi

            echo "======================================"
            echo "Valgrind: $target"
            echo "======================================"
            valgrind \
              --tool=memcheck \
              --log-file="valgrind_log_${target}" \
              --leak-check=yes \
              --show-reachable=yes \
              --track-fds=yes \
              --fair-sched=try \
              "$test_bin"
          done

      - name: Run L0 tests under gdb (opt-in on failure)
        if: ${{ failure() && env.ENABLE_GDB == '1' }}
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/install/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/install/usr/lib:$GITHUB_WORKSPACE/install/usr/lib/wpeframework:$GITHUB_WORKSPACE/install/usr/lib/wpeframework/plugins:${LD_LIBRARY_PATH:-}"

          build_dir="build/entservices-appgateway-l0tests-only"
          for target in ${{ env.L0_PLUGIN_TESTS }}; do
            test_bin="${build_dir}/${target}"
            if [ ! -x "$test_bin" ]; then continue; fi
            echo "=== gdb: $target ==="
            gdb -q -batch -ex "set pagination off" -ex "run" -ex "bt full" --args "$test_bin" | tee "l0-test-gdb-${target}.log"
          done

      - name: Fail workflow if tests failed
        if: ${{ always() }}
        env:
          RUN_L0_TESTS_OUTCOME: ${{ steps.run_l0_tests.outcome }}
        run: |
          set -euo pipefail
          failed=0

          if [ "${RUN_L0_TESTS_OUTCOME}" != "success" ]; then
            echo "L0 test execution step failed (non-zero exit)"
            failed=1
          fi

          if [ -f l0-test.log ]; then
            echo "==== Failed test cases (final gate) ===="
            grep -E '^\[ +FAILED +\]' l0-test.log || true
            grep -E '^FAIL:' l0-test.log || true

            echo "==== Total failures (final gate) ===="
            grep -E 'l0test total failures:? [0-9]+' l0-test.log || true

            if grep -Eq 'l0test total failures:? [1-9][0-9]*' l0-test.log; then
              echo "L0 tests reported failures"
              failed=1
            fi
          else
            echo "l0-test.log not found in final gate"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Generate coverage report (lcov + HTML via genhtml)
        continue-on-error: true
        run: |
          set -euo pipefail

          ARTIFACT_ROOT="$GITHUB_WORKSPACE"
          rm -rf "$ARTIFACT_ROOT/coverage-html" coverage.info filtered_coverage.info || true
          mkdir -p "$ARTIFACT_ROOT/coverage-html"

          build_dir="$GITHUB_WORKSPACE/build/entservices-appgateway-l0tests-only"

          # Detect lcov version — lcov 2.x uses different --rc key names and supports --ignore-errors
          # no_exception_branch: excludes compiler-generated exception-handling branches (landing pads,
          # stack unwinding) that are invisible in source code and untestable in practice.
          LCOV_IGNORE=""
          BRANCH_RC="--rc lcov_branch_coverage=1"
          EXCL_BR=""
          GENHTML_IGNORE=""
          if lcov --version 2>&1 | grep -qE 'version 2\.'; then
            LCOV_IGNORE="--ignore-errors version,gcov,mismatch,unused,inconsistent"
            BRANCH_RC="--rc branch_coverage=1"
            EXCL_BR="--rc no_exception_branch=1"
            GENHTML_IGNORE="--ignore-errors version,unmapped,inconsistent,corrupt,source,empty,range,format,path,missing,mismatch,negative,branch,annotate,deprecated,package"
          fi

          lcov $LCOV_IGNORE $BRANCH_RC $EXCL_BR -c -o coverage.info -d "$build_dir" || true

          echo "lcov version: $(lcov --version)"
          BRDA_COUNT=$(grep -c "^BRDA:" coverage.info 2>/dev/null) || BRDA_COUNT=0
          echo "BRDA lines in coverage.info: $BRDA_COUNT"
          if [ "$BRDA_COUNT" = "0" ]; then
            echo "WARNING: No branch data captured — branch coverage will be empty"
          fi

          if [ ! -s coverage.info ]; then
            echo "coverage.info missing/empty; skipping filtering + HTML generation"
            exit 0
          fi

          lcov $LCOV_IGNORE $BRANCH_RC $EXCL_BR \
            -r coverage.info \
            '/usr/include/*' \
            '*/install/usr/include/*' \
            '*/Tests/L0Tests/*' \
            '*/Thunder/*' \
            -o filtered_coverage.info || true

          if [ ! -s filtered_coverage.info ]; then
            echo "filtered_coverage.info missing/empty; skipping HTML generation"
            exit 0
          fi

          echo "Running genhtml with: $GENHTML_IGNORE $BRANCH_RC"
          set +e
          genhtml --keep-going $GENHTML_IGNORE $BRANCH_RC --branch-coverage \
            -o "$ARTIFACT_ROOT/coverage-html" \
            -t "entservices-appgateway L0 coverage" \
            filtered_coverage.info 2>&1
          genhtml_rc=$?
          set -e
          echo "genhtml exit code: $genhtml_rc"
          if [ "$genhtml_rc" -ne 0 ]; then
            echo "WARNING: genhtml failed — check error output above"
          fi
          ls -la "$ARTIFACT_ROOT/coverage-html/" || true

      - name: Upload artifacts
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-L0-appgateway
          path: |
            coverage-html/
            coverage.info
            filtered_coverage.info
            l0-test.log
            valgrind_log_*
          if-no-files-found: warn
